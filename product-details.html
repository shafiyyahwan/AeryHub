<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeryHub - Product Details</title>
  <link rel="stylesheet" href="css/style1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --bg: #fafaf5;
      --surface: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #e8ede5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .phone-frame {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border-radius: 48px;
      box-shadow:
        0 0 0 12px #1a1a1a,
        0 0 0 14px #333,
        0 30px 80px rgba(0,0,0,0.4),
        inset 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .status-bar .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 28px;
      background: #1a1a1a;
      border-radius: 0 0 18px 18px;
    }

    .status-icons { display: flex; gap: 6px; align-items: center; }

    .screen {
      flex: 1;
      overflow-y: auto;
      background: #fafafa;
      position: relative;
      scrollbar-width: none;
      padding-bottom: 20px;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* LOADING SPINNER */
    .loading { display: flex; justify-content: center; align-items: center; height: 100%; min-height: 400px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .img-wrap { position: relative; background: #f0f0f0; height: 280px; overflow: hidden; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }

    .img-placeholder { width: 100%; height: 100%; background: #edf4ed; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; position: absolute; top:0; left:0; }
    .img-placeholder i { font-size: 48px; color: #2e7d32; opacity: 0.3; }

    .gallery-back {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #f4f5f7;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #1f2937;
      font-size: 16px;
      z-index: 10;
    }

    .gallery-actions-right {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .gallery-btn-square {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #f4f5f7;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1f2937;
      font-size: 16px;
      text-decoration: none;
      position: relative;
    }

    .img-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .dot.active { background: #fff; width: 16px; border-radius: 3px; }

    .price-block { background: #fff; padding: 16px; border-bottom: 6px solid #f5f5f5; }

    .prod-name-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
    .prod-name { font-size: 18px; color: #222; font-weight: 700; line-height: 1.3; flex: 1; }

    .prod-like-btn {
      background: #fcfcfc;
      border: 1px solid #f0f0f0;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }
    .prod-like-btn.active i { color: #d11a2a; }

    .prod-price { font-size: 26px; font-weight: 800; color: #16a34a; line-height: 1.1; margin-top: 4px; }
    .price-sub { font-size: 11px; color: #666; margin-top: 2px; font-weight: 500; }
    .rating-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .stars-container { color: #ffc107; font-size: 11px; display: inline-flex; gap: 1px; }
    .rating-num { font-size: 12px; font-weight: 700; color: #333; }
    .sold-txt { font-size: 11px; color: #777; }
    .sep { color: #e0e0e0; font-size: 11px; }

    .var-block { background: #fff; padding: 16px; border-bottom: 6px solid #f5f5f5; }
    .var-label { font-size: 12px; color: #555; margin-bottom: 10px; font-weight: 500; }
    .var-label b { color: #16a34a; font-weight: 700; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1.5px solid #eee; background: #fff; color: #444; cursor: pointer; }
    .chip.active { border-color: #16a34a; color: #16a34a; background: #e8f5e9; }

    .inline-qty-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #e5e7eb;
      padding-top: 14px;
      margin-top: 4px;
    }
    .inline-qty-label { font-size: 12px; color: #555; font-weight: 600; }

    .inline-qty-container {
      display: flex;
      align-items: center;
      background: #f4f4f5;
      border-radius: 10px;
      padding: 2px;
      height: 38px;
      border: 1px solid #e4e4e7;
    }
    .inline-qty-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #52525b;
    }
    .inline-qty-num {
      min-width: 30px;
      text-align: center;
      font-size: 14px;
      color: #18181b;
      font-weight: 700;
    }

    .desc-block { background: #fff; padding: 16px; border-bottom: 6px solid #f5f5f5; }
    .block-title { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px; }
    .desc-txt { font-size: 13px; color: #555; line-height: 1.6; }

    .shop-block { background: #fff; padding: 16px; border-bottom: 6px solid #f5f5f5; }
    .shop-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .shop-av { width: 44px; height: 44px; border-radius: 12px; background: #e8f5e9; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #eaeaea; }
    .shop-av img { width: 100%; height: 100%; object-fit: cover; }

    .shop-info { flex: 1; min-width: 0; }

    /* GABUNGAN ICON SEBARIS */
    .shop-name-wrapper { display: flex; align-items: center; gap: 6px; }
    .shop-name { font-size: 15px; font-weight: 700; color: #111827; line-height: 1.2; }

    /* 1. Verified Rait Hijau */
    .verified-circle-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #16a34a;
      color: #ffffff;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 2. Badge Sijil Ber-Hover */
    .cert-tooltip-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cert-circle-trigger {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #bae6fd;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .cert-circle-trigger:hover {
      background: #0369a1;
      color: #fff;
    }

    .cert-tooltip-box {
      position: absolute;
      bottom: 140%;
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: #1e293b;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      width: 160px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: all 0.15s ease;
      text-align: center;
      line-height: 1.3;
    }

    .cert-tooltip-box::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px;
      border-style: solid;
      border-color: #1e293b transparent transparent transparent;
    }

    .cert-tooltip-container:hover .cert-tooltip-box {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .shop-status-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .shop-status { font-size: 11px; color: #27ae60; display: flex; align-items: center; gap: 4px; font-weight: 500; }
    .shop-status::before { content:''; width: 5px; height: 5px; border-radius: 50%; background: #27ae60; }

    .shop-state { font-size: 11px; color: #777; margin-top: 3px; }

    .shop-stats { display: flex; margin-top: 12px; border: 1px solid #f0f0f0; border-radius: 10px; overflow: hidden; background: #fafafa; }
    .stat-item { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid #f0f0f0; }
    .stat-item:last-child { border-right: none; }
    .stat-num { font-size: 13px; font-weight: 700; color: #333; }
    .stat-lbl { font-size: 10px; color: #888; }

    .review-block { background: #fff; padding: 16px; border-bottom: 6px solid #f5f5f5; }
    .review-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .see-all { font-size: 11px; color: #16a34a; cursor: pointer; font-weight: 600; }
    .rv-summary { display: flex; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #f5f5f5; margin-bottom: 8px; }
    .rv-big { font-size: 32px; font-weight: 800; color: #111827; line-height: 1; }

    .rv-bars { flex: 1; }
    .bar-row { display: flex; align-items: center; gap: 6px; margin: 1px 0; }
    .bar-lbl { font-size: 10px; color: #777; width: 8px; text-align: right; }
    .bar-track { flex: 1; height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; background: #16a34a; }

    .rv-card { padding: 14px 0; border-bottom: 1px solid #f5f5f5; display: flex; gap: 12px; align-items: flex-start; }
    .rv-card:last-child { border-bottom: none; }

    .rv-avatar { font-size: 34px; color: #d1d5db; line-height: 1; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .rv-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }

    .rv-buyer-name { font-size: 13px; font-weight: 700; color: #1f2937; }
    .rv-stars-row { display: flex; align-items: center; gap: 6px; }
    .rv-date-inline { font-size: 11px; color: #9ca3af; font-weight: 400; }
    .rv-variant-row { font-size: 11px; color: #6b7280; font-weight: 500; margin-top: 1px; }
    .rv-txt-comment { font-size: 13px; color: #4b5563; line-height: 1.5; margin-top: 2px; }

    .bottom-bar {
      background: #fff;
      border-top: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      padding: 14px 18px 20px;
      gap: 12px;
      z-index: 20;
    }

    .bb-chat-style {
      flex: 1;
      height: 48px;
      background: #ffffff;
      border: 1.5px solid #16a34a;
      border-radius: 16px;
      color: #16a34a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .bb-add-style {
      flex: 2;
      height: 48px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.25);
    }

    /* TOAST STYLE */
    .toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; z-index: 999; opacity: 0; pointer-events: none; transition: all 0.2s ease; font-weight: 500; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="screen" id="mainScreen">
    <div id="loadingState" class="loading"><div class="spinner"></div></div>

    <div id="productContent" style="display:none">

      <div class="img-wrap">

          <span style="font-size:11px; margin-top:4px;">No Image Available</span>

        <img id="mainImg" src="" alt="" onerror="document.getElementById('fallbackWrap').style.display='flex'; this.style.display='none';">

        <div class="gallery-actions-right">

      <div class="price-block">
        <div class="prod-name-row">

          <button class="prod-like-btn" id="wishBtnRow"><i class="fa-solid fa-heart" id="wishIconRow"></i></button>
        </div>

          <span class="rating-num" id="prodRatingText">0.0</span>

          <span class="sold-txt" id="prodReviewsCount">0 reviews</span>

          <div class="inline-qty-label">Quantity</div>

      <!-- SHOP BLOCK -->
      <div class="shop-block">

        <div class="shop-row" id="shopPreview">

          <div class="shop-info">

            <div class="shop-name-wrapper">
              <div class="shop-name" id="shopName">...</div>
              <div id="verifiedIconSlot"></div>  <!-- 1. Bulatan Rait Hijau -->
              <div id="badgeHoverSlot"></div>   <!-- 2. Bulatan Sijil + Tooltip -->

            <div class="shop-status-row"><div class="shop-status">Active recently</div></div>

        <div class="shop-stats">

  <div class="bottom-bar">
    <button class="bb-chat-style" onclick="chatFarmer()"><i class="fa-solid fa-comment-dots"></i> <span>Chat</span></button>

  </div>
</div>

<div class="toast" id="customToast"></div>

<script src="script.js"></script>
<script>
  let currentProduct = null;
  let currentQty = 1;
  let selectedPrice = 0;
  let selectedUnitLabel = '';

  const REVIEWS = [
    { name: "Amir Hamzah", rating: 5, date: "28 May 2025", text: "Super fresh! Tomato tiba hari yang sama dipetik." },
    { name: "Nurul Ain", rating: 4, date: "25 May 2025", text: "Kualiti bagus, pembungkusan cantik." }
  ];

  function renderStarsHtml(rating) {
    let starsHtml = '';
    const rounded = Math.round(rating * 2) / 2;
    const full = Math.floor(rounded);
    const half = (rounded % 1 !== 0);
    for (let i = 0; i < full; i++) starsHtml += '<i class="fa-solid fa-star"></i>';
    if (half) starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
    for (let i = full + (half ? 1 : 0); i < 5; i++) starsHtml += '<i class="fa-regular fa-star"></i>';
    return `<div class="stars-container">${starsHtml}</div>`;
  }

  function selectVariation(label, price, element) {
    selectedPrice = Number(price);
    selectedUnitLabel = label;
    document.getElementById('prodPrice').textContent = 'RM ' + selectedPrice.toFixed(2);
    document.getElementById('prodUnit').textContent = 'per ' + label;
    document.getElementById('varSelected').textContent = label;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
  }

  function updateCartBadge() {
    let currentCart = JSON.parse(localStorage.getItem('cart')) || [];
    const count = currentCart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
    document.querySelectorAll('.cart-nav-icon').forEach(el => {
      let badge = el.querySelector('.cart-count');
      if (!badge) {
        badge = document.createElement('span'); badge.className = 'cart-count';
        badge.style = "position:absolute;top:-4px;right:-4px;background:#ee4d2d;color:white;border-radius:50%;padding:2px 6px;font-size:10px;font-weight:700;border:2px solid white;min-width:12px;text-align:center;";
        el.appendChild(badge);
      }
      badge.textContent = count; badge.style.display = count > 0 ? 'block' : 'none';
    });
  }

  function loadProductDetails() {
    if (typeof AppState !== 'undefined' && AppState.init) AppState.init();
    currentQty = 1;
    if (document.getElementById('qtyDisplay')) document.getElementById('qtyDisplay').textContent = '1';

    const pid = parseInt(localStorage.getItem('currentProduct') || '1');
    currentProduct = PRODUCTS.find(p => p.id === pid) || PRODUCTS[0];
    const farmer = (typeof FARMERS !== 'undefined') ? FARMERS.find(f => f.id === currentProduct.farmerId) : null;

    setTimeout(() => {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('productContent').style.display = 'block';

      // Gambar & Fallback handler
      if (currentProduct.images && currentProduct.images.length > 0) {
        const mainImg = document.getElementById('mainImg');
        mainImg.src = currentProduct.images[0]; mainImg.style.display = 'block';
        if(document.getElementById('fallbackWrap')) document.getElementById('fallbackWrap').style.display = 'none';
      }

      // Variation Chips handler
      const varContainer = document.getElementById('variationContainer');
      varContainer.innerHTML = '';
      if (currentProduct.pricing && currentProduct.pricing.length > 0) {
        currentProduct.pricing.forEach((item, idx) => {
          const chip = document.createElement('div');
          chip.className = 'chip' + (idx === 0 ? ' active' : '');
          chip.textContent = item.label;
          chip.onclick = function() { selectVariation(item.label, item.price, this); };
          varContainer.appendChild(chip);
          if (idx === 0) { selectedPrice = Number(item.price); selectedUnitLabel = item.label; }
        });
      } else {
        selectedPrice = Number(currentProduct.price || 0);
        selectedUnitLabel = currentProduct.unit || 'unit';
        const chip = document.createElement('div');
        chip.className = 'chip active';
        chip.textContent = selectedUnitLabel;
        varContainer.appendChild(chip);
      }

      // Set Harga Utama & Unit Info
      document.getElementById('prodPrice').textContent = 'RM ' + selectedPrice.toFixed(2);
      document.getElementById('prodUnit').textContent = 'per ' + selectedUnitLabel;
      document.getElementById('varSelected').textContent = selectedUnitLabel;

      // Dots Gallery Generator (Sebab terpadam tadi)
      const dots = document.getElementById('galleryDots');
      if (dots) {
        dots.innerHTML = '';
        if (currentProduct.images) {
          currentProduct.images.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = 'dot' + (i === 0 ? ' active' : '');
            dots.appendChild(d);
          });
        }
      }

      // Wishlist Handler
      const wishBtnRow = document.getElementById('wishBtnRow');
      const wishIconRow = document.getElementById('wishIconRow');
      let isWished = false;
      if (wishBtnRow && wishIconRow) {
        wishBtnRow.onclick = () => {
          isWished = !isWished;
          if(isWished) {
            wishBtnRow.classList.add('active');
            showToast('❤️ Added to wishlist!');
          } else {
            wishBtnRow.classList.remove('active');
            showToast('Removed from wishlist');
          }
        };
      }

      // Info Produk
      document.getElementById('prodName').textContent = currentProduct.name;
      document.getElementById('prodStarsSlot').innerHTML = renderStarsHtml(currentProduct.rating || 0);
      document.getElementById('prodRatingText').textContent = (currentProduct.rating || 0).toFixed(1);
      document.getElementById('summaryBigRating').textContent = (currentProduct.rating || 0).toFixed(1);
      document.getElementById('prodReviewsCount').textContent = `${currentProduct.reviews || 0} reviews`;
      document.getElementById('prodDesc').textContent = currentProduct.description || 'Tiada penerangan.';
      document.getElementById('distVal').textContent = farmer && farmer.state ? farmer.state : "Selangor";

      // Info Kedai & Dua Sijil
      if (farmer) {
        if (farmer.image) document.getElementById('shopAvSlot').innerHTML = `<img src="${farmer.image}">`;
        document.getElementById('shopName').textContent = farmer.shopName || farmer.farm || (farmer.name + ' Organic Store');
        document.getElementById('shopLocation').textContent = `${farmer.city || 'Kuala Kubu Bharu'}, ${farmer.state || 'Selangor'}`;
        document.getElementById('statRating').innerHTML = `${(farmer.rating || 0).toFixed(1)} <span style="color:#ffc107;font-size:11px">★</span>`;

        const iconSlot = document.getElementById('verifiedIconSlot');
        const hoverSlot = document.getElementById('badgeHoverSlot');

        // 1. Bulatan Rait Hijau
        iconSlot.innerHTML = `
          <div class="verified-circle-icon">
            <i class="fa-solid fa-check"></i>
          </div>
        `;

        // 2. Bulatan Badge Sijil + Fungsi Hover Tooltip
        const certListString = (farmer.certifications && farmer.certifications.length > 0)
          ? farmer.certifications.join(', ')
          : "myGAP, Organik Malaysia";

        hoverSlot.innerHTML = `
          <div class="cert-tooltip-container">
            <div class="cert-circle-trigger">
              <i class="fa-solid fa-certificate"></i>
            </div>
            <div class="cert-tooltip-box">
              <strong style="color:#38bdf8; display:block; margin-bottom:2px;">Sijil Rasmi:</strong>
              ${certListString}
            </div>
          </div>
        `;

        document.getElementById('shopPreview').onclick = () => {
          localStorage.setItem('currentFarmer', farmer.id);
          window.location.href = 'farmer-profile.html';
        };
      }

      // Render Senarai Komen Pembeli
      const rc = document.getElementById('reviewsContainer');
      if (rc) {
        rc.innerHTML = '';
        REVIEWS.forEach(r => {
          const div = document.createElement('div');
          div.className = 'rv-card';
          div.innerHTML = `
            <div class="rv-avatar"><i class="fa-solid fa-circle-user"></i></div>
            <div class="rv-content">
              <div class="rv-buyer-name">${r.name}</div>
              <div class="rv-stars-row">
                ${renderStarsHtml(r.rating)}
                <span class="rv-date-inline">(${r.date})</span>
              </div>
              <div class="rv-variant-row">Variation: ${selectedUnitLabel}</div>
              <div class="rv-txt-comment">${r.text}</div>
            </div>
          `;
          rc.appendChild(div);
        });
      }

      updateCartBadge();
    }, 400);
  }

  document.addEventListener('DOMContentLoaded', loadProductDetails);

  function changeQty(delta) {
    currentQty = Math.max(1, currentQty + delta);
    document.getElementById('qtyDisplay').textContent = currentQty;
  }

  window.showToast = function(msg) {
    const t = document.getElementById('customToast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  };

  function addProductToCart() {
    if(!currentProduct) return;
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let existing = cart.find(item => item.id === currentProduct.id && item.variant === selectedUnitLabel);
    if(existing) {
      existing.qty = Number(existing.qty) + currentQty;
    } else {
      cart.push({
        id: currentProduct.id,
        name: currentProduct.name,
        price: selectedPrice,
        variant: selectedUnitLabel,
        qty: currentQty,
        image: (currentProduct.images && currentProduct.images.length > 0) ? currentProduct.images[0] : ''
      });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    showToast('🛒 Added to cart successfully!');
  }

  function chatFarmer() {
    showToast('Opening chat room...');
  }
</script>
</body>
</html>
