<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeryHub - Chat</title>
  <link rel="stylesheet" href="css/style1.css">
  <style>
    body { background: #e0ead8; }
    .convo-item { display: flex; gap: 12px; align-items: center; padding: 14px 20px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .convo-item:hover { background: var(--gray-50); }
    .convo-avatar-wrap { position: relative; }
    .convo-avatar { width: 52px; height: 52px; border-radius: 16px; object-fit: cover; }
    .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--green-500); border: 2px solid var(--surface); }
    .convo-info { flex: 1; min-width: 0; }
    .convo-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .convo-last { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-right { text-align: right; flex-shrink: 0; }
    .convo-time { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .unread-badge { background: var(--primary); color: white; border-radius: 10px; padding: 2px 8px; font-size: 11px; font-weight: 800; }

    /* Chat screen */
    .chat-screen { display: none; flex-direction: column; height: 100%; position: absolute; inset: 0; background: var(--bg); z-index: 20; }
    .chat-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-size: 15px; font-weight: 800; color: var(--text); }
    .chat-header-status { font-size: 12px; color: var(--green-600); font-weight: 600; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
    .chat-messages::-webkit-scrollbar { display: none; }
    .msg-row { display: flex; }
    .msg-row.sent { justify-content: flex-end; }
    .msg-day-label { text-align: center; font-size: 11px; color: var(--text-muted); font-weight: 600; margin: 8px 0; }
    .chat-input-bar { padding: 12px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .chat-input { flex: 1; border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 14px; font-family: var(--font); background: var(--bg); color: var(--text); outline: none; }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .quick-replies { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 8px 14px 0; }
    .quick-replies::-webkit-scrollbar { display: none; }
    .qr-chip { padding: 6px 14px; border-radius: 20px; background: var(--green-50); border: 1.5px solid var(--green-200); font-size: 12px; font-weight: 600; color: var(--green-700); cursor: pointer; white-space: nowrap; }
    .product-preview-bubble { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 10px; margin-bottom: 8px; max-width: 220px; }
    .ppb-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .ppb-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .ppb-price { font-size: 13px; font-weight: 800; color: var(--primary); }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">📶 🔋</div>
  </div>

  <!-- Conversation List -->
  <div class="screen" id="convoList">
    <div class="page-header">
      <div class="page-title">Messages</div>
      <button class="icon-btn" onclick="showToast('New message feature coming soon!')">✏️</button>
    </div>

    <!-- Search -->
    <div style="padding:12px 16px 0">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search conversations...">
      </div>
    </div>

    <!-- Conversations -->
    <div style="margin-top:12px" id="convoListItems"></div>
  </div>

  <!-- Chat Screen (opens over list) -->
  <div class="chat-screen" id="chatScreen">
    <div class="chat-header">
      <button onclick="closeChat()" style="background:var(--gray-100);border:none;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer">←</button>
      <img id="chatAvatar" src="" style="width:40px;height:40px;border-radius:12px;object-fit:cover">
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatName">Farmer</div>
        <div class="chat-header-status">🟢 Online · usually replies instantly</div>
      </div>
      <button onclick="showToast('Call feature coming soon!')" style="background:var(--green-100);border:none;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer">📞</button>
    </div>

    <!-- Product Preview (if opened from product) -->
    <div id="productContext" style="display:none;padding:10px 14px 0">
      <div class="product-preview-bubble">
        <img id="ppbImg" src="" class="ppb-img">
        <div class="ppb-name" id="ppbName"></div>
        <div class="ppb-price" id="ppbPrice"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;padding-left:2px">Asking about this product</div>
    </div>

    <!-- Quick Replies -->
    <div class="quick-replies" id="quickReplies">
      <div class="qr-chip" onclick="sendQuick('Is this still available?')">Is this available?</div>
      <div class="qr-chip" onclick="sendQuick('When is the next harvest?')">Next harvest?</div>
      <div class="qr-chip" onclick="sendQuick('Can I pick up from farm today?')">Farm pickup today?</div>
      <div class="qr-chip" onclick="sendQuick('Do you offer bulk discounts?')">Bulk discount?</div>
      <div class="qr-chip" onclick="sendQuick('What certifications do you have?')">Certifications?</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-bar">
      <button style="background:none;border:none;font-size:22px;cursor:pointer" onclick="showToast('Attach image coming soon!')">📎</button>
      <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      Home
    </a>
    <a href="marketplace.html" class="nav-item">
      <span class="nav-icon">🛍️</span>
      Shop
    </a>
    <a href="orders.html" class="nav-item">
      <span class="nav-icon">📦</span>
      Orders
    </a>
    <a href="chat.html" class="nav-item active">
      <span class="nav-icon">💬</span>
      Chat
    </a>
    <a href="consumer-profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      Profile
    </a>
  </nav>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
  let currentConvo = null;

  const AUTO_REPLIES = [
    "Hello! Thank you for reaching out! 😊",
    "Yes, the produce is freshly harvested today!",
    "You're welcome to pick up at the farm anytime between 7AM–12PM.",
    "We do offer bulk discounts for orders above 5kg. Please let me know how much you need!",
    "All our products are SALM certified organic. No pesticides used.",
    "Sure! I'll prepare your order fresh for you.",
    "Thank you for choosing AeryHub. See you at the farm! 🌱",
    "The next harvest is scheduled for tomorrow morning.",
    "We can arrange same-day delivery if you order before 10AM.",
  ];
  let replyIdx = 0;

  const EXTENDED_CONVOS = [
    ...CHAT_CONVERSATIONS,
    { id: 3, farmerId: 9, farmerName: "Aisyah Mohd", lastMessage: "We have fresh pandan and lemongrass today!", time: "2d ago", unread: 0, messages: [
        { from: "consumer", text: "Do you have pandan leaves?", time: "2 days ago" },
        { from: "farmer", text: "We have fresh pandan and lemongrass today!", time: "2 days ago" },
      ]},
  ];

  function renderConvos() {
    const list = document.getElementById('convoListItems');
    EXTENDED_CONVOS.forEach(convo => {
      const farmer = FARMERS.find(f => f.id === convo.farmerId);
      const div = document.createElement('div');
      div.className = 'convo-item';
      div.onclick = () => openChat(convo.id);
      div.innerHTML = `
      <div class="convo-avatar-wrap">
        <img src="${farmer?.image}" class="convo-avatar" alt="${convo.farmerName}">
        ${convo.id === 1 ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="convo-info">
        <div class="convo-name">${convo.farmerName} <span style="font-size:11px;font-weight:400;color:var(--text-muted)">${farmer?.farm || ''}</span></div>
        <div class="convo-last">${convo.lastMessage}</div>
      </div>
      <div class="convo-right">
        <div class="convo-time">${convo.time}</div>
        ${convo.unread > 0 ? `<span class="unread-badge">${convo.unread}</span>` : ''}
      </div>
    `;
      list.appendChild(div);
    });
  }

  function openChat(id) {
    currentConvo = EXTENDED_CONVOS.find(c => c.id === id);
    const farmer = FARMERS.find(f => f.id === currentConvo.farmerId);

    document.getElementById('chatAvatar').src = farmer?.image || '';
    document.getElementById('chatName').textContent = currentConvo.farmerName;

    // Check if opened from product
    const prodId = localStorage.getItem('chatFarmer');
    const prodCtx = document.getElementById('productContext');
    if (prodId) {
      const prod = PRODUCTS.find(p => p.farmerId === parseInt(prodId));
      if (prod) {
        prodCtx.style.display = 'block';
        document.getElementById('ppbImg').src = prod.images[0];
        document.getElementById('ppbName').textContent = prod.name;
        document.getElementById('ppbPrice').textContent = `RM ${prod.price.toFixed(2)} / ${prod.unit}`;
      }
      localStorage.removeItem('chatFarmer');
    }

    renderMessages();
    document.getElementById('chatScreen').style.display = 'flex';
    setTimeout(scrollToBottom, 100);
  }

  function closeChat() {
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('productContext').style.display = 'none';
    currentConvo = null;
  }

  function renderMessages() {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '<div class="msg-day-label">Today</div>';
    currentConvo.messages.forEach(msg => {
      appendMessage(msg.from, msg.text, msg.time, false);
    });
  }

  function appendMessage(from, text, time, animate = true) {
    const container = document.getElementById('chatMessages');
    const row = document.createElement('div');
    row.className = 'msg-row ' + (from === 'consumer' ? 'sent' : '');
    row.innerHTML = `
    <div>
      <div class="message-bubble ${from === 'consumer' ? 'sent' : 'received'}" ${animate ? 'style="animation:fadeInUp 0.3s ease"' : ''}>${text}</div>
      <div class="message-time ${from === 'consumer' ? 'sent' : ''}">${time}</div>
    </div>
  `;
    container.appendChild(row);
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    const now = new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
    appendMessage('consumer', text, now);
    input.value = '';
    scrollToBottom();

    // Auto reply
    setTimeout(() => {
      const reply = AUTO_REPLIES[replyIdx % AUTO_REPLIES.length];
      replyIdx++;
      appendMessage('farmer', reply, now);
      scrollToBottom();
    }, 900 + Math.random() * 600);
  }

  function sendQuick(text) {
    document.getElementById('messageInput').value = text;
    sendMessage();
    // Hide quick replies after first use
    document.getElementById('quickReplies').style.display = 'none';
  }

  function scrollToBottom() {
    const m = document.getElementById('chatMessages');
    m.scrollTop = m.scrollHeight;
  }

  document.addEventListener('DOMContentLoaded', () => {
    AppState.init();
    renderConvos();

    // If coming from product page
    const chatFarmer = localStorage.getItem('chatFarmer');
    if (chatFarmer) openChat(1);
  });
</script>
</body>
</html>
