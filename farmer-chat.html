<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeryHub - Farmer Chat</title>

  <link rel="stylesheet" href="css/style1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    body { background:#F5F5EE; }

    .status-bar {
      background:#1F5A2D !important;
      color:#fff !important;
    }

    .status-bar span,
    .status-icons { color:#fff !important; }

    .screen {
      flex:1;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      background:#F5F5EE;
      position:relative;
      scrollbar-width:none;
      padding-bottom:80px;
    }

    .screen::-webkit-scrollbar { display:none; }

    /* ── BEFORE CLICK: Conversation list header, same as consumer chat ── */
    .green-zone {
      background:#1F5A2D;
      padding:0 20px 20px;
      position:sticky;
      top:0;
      z-index:100;
    }

    .home-header {
      background:transparent !important;
      padding:14px 0 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .app-brand {
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .brand-name {
      font-size:20px;
      font-weight:700;
      color:#ffffff;
      line-height:1;
      letter-spacing:.2px;
    }

    .icon-btn {
      width:40px;
      height:40px;
      border-radius:12px;
      background:rgba(255,255,255,.14);
      color:#fff;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      cursor:pointer;
      text-decoration:none;
      position:relative;
      flex-shrink:0;
    }

    .icon-btn:active { background:rgba(255,255,255,.24); }

    .search-bar {
      background:#fff;
      border:none;
      border-radius:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
      margin-top:15px;
    }

    /* Let global style1.css handle search icon/input spacing as much as possible */
    .search-bar input {
      font-family:var(--font);
      font-size:14px;
      font-weight:500;
    }

    /* ── Conversation list ── */
    .convo-list-wrap {
      margin-top:0;
      background:#F5F5EE;
    }

    #convoListItems {
      background:#FFFFFF;
      border-top-left-radius:18px;
      border-top-right-radius:18px;
      overflow:hidden;
    }

    .convo-item {
      display:flex;
      gap:14px;
      align-items:center;
      padding:14px 20px;
      cursor:pointer;
      border-bottom:1px solid #f3f4f6;
      background:#FFFFFF;
      transition:background .15s;
    }

    .convo-item:hover,
    .convo-item:active { background:var(--gray-50); }

    .convo-avatar-wrap {
      position:relative;
      width:48px;
      height:48px;
      flex-shrink:0;
    }

    .convo-avatar {
      width:48px !important;
      height:48px !important;
      min-width:48px !important;
      max-width:48px !important;
      border-radius:14px;
      object-fit:cover;
      border:1px solid #eee;
      display:block;
      background:#ebeeeb;
    }

    .online-dot {
      position:absolute;
      bottom:-1px;
      right:-1px;
      width:11px;
      height:11px;
      border-radius:50%;
      background:#22c55e;
      border:2px solid var(--surface);
    }

    .convo-info { flex:1; min-width:0; }

    .convo-name {
      font-size:13.5px;
      font-weight:700;
      color:var(--text);
      margin-bottom:3px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .convo-last {
      font-size:12.5px;
      color:var(--text-muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:500;
    }

    .convo-right {
      text-align:right;
      flex-shrink:0;
    }

    .convo-time {
      font-size:11px;
      color:var(--text-muted);
      margin-bottom:5px;
      font-weight:500;
    }

    .unread-badge {
      background:#1F5A2D;
      color:white;
      border-radius:10px;
      padding:2px 7px;
      font-size:10px;
      font-weight:800;
    }

    /* ── AFTER CLICK: Specific chat, same style as consumer chat ── */
    .chat-screen {
      display:none;
      flex-direction:column;
      position:absolute;
      top:44px;
      bottom:0;
      left:0;
      right:0;
      background:#F5F5EE;
      z-index:200;
    }

    .chat-header {
      min-height:82px;
      padding:18px 18px;
      background:#1F5A2D;
      border-bottom:1px solid rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
    }

    .chat-header .icon-btn {
      background:transparent;
      color:#ffffff;
      width:30px;
      height:30px;
      border:none;
      outline:none;
      box-shadow:none;
      border-radius:0;
      font-size:15px;
      padding:0;
    }

    .chat-header .icon-btn:focus,
    .chat-header .icon-btn:focus-visible,
    .chat-header .icon-btn:active {
      background:transparent;
      outline:none;
      box-shadow:none;
    }

    #chatAvatar {
      width:50px !important;
      height:50px !important;
      border-radius:12px !important;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.85);
      flex-shrink:0;
    }

    .chat-header-info { flex:1; min-width:0; }

    .chat-header-name {
      font-size:16px;
      font-weight:800;
      color:#ffffff;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chat-header-status {
      font-size:11.5px;
      color:#E6F2DF;
      font-weight:600;
      margin-top:6px;
      display:flex;
      align-items:center;
      gap:5px;
    }

    .chat-info-btn {
      width:34px;
      height:34px;
      border-radius:0;
      background:transparent;
      color:#ffffff;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      cursor:pointer;
      flex-shrink:0;
      outline:none;
      box-shadow:none;
      padding:0;
    }

    .chat-info-btn i { font-size:22px; }

    .chat-info-btn:focus,
    .chat-info-btn:focus-visible,
    .chat-info-btn:active {
      background:transparent;
      outline:none;
      box-shadow:none;
    }

    .chat-messages {
      flex:1;
      overflow-y:auto;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
      background:#F5F5EE;
      scrollbar-width:none;
    }

    .chat-messages::-webkit-scrollbar { display:none; }

    .msg-row {
      display:flex;
      width:100%;
    }

    .msg-row.sent { justify-content:flex-end; }

    .msg-wrapper {
      max-width:78%;
      display:flex;
      flex-direction:column;
    }

    .msg-row.sent .msg-wrapper { align-items:flex-end; }

    .message-bubble {
      display:inline-block;
      width:fit-content;
      max-width:100%;
      padding:11px 15px;
      box-sizing:border-box;
      font-size:13px;
      line-height:1.5;
      font-weight:600;
      box-shadow:0 2px 4px rgba(0,0,0,.02);
    }

    .message-bubble.received {
      background:#ffffff;
      color:#1f2937;
      border-radius:4px 16px 16px 16px;
      border:1px solid #eef0ed;
    }

    .message-bubble.sent {
      background:#1F5A2D;
      color:#ffffff;
      border-radius:16px 16px 4px 16px;
    }

    .message-time {
      font-size:10px;
      color:#9ca3af;
      margin-top:4px;
      font-weight:600;
    }

    .msg-day-label {
      text-align:center;
      font-size:11px;
      color:#9ca3af;
      font-weight:700;
      margin:8px 0;
      letter-spacing:.5px;
    }

    /* Product inquiry card inside chat messages */
    .product-inquiry-row {
      display:flex;
      width:100%;
    }

    .product-inquiry-row.sent { justify-content:flex-end; }
    .product-inquiry-row.received { justify-content:flex-start; }

    .product-inquiry-card {
      max-width:270px;
      background:#ffffff;
      border:1px solid #E1E7DD;
      padding:10px;
      box-shadow:0 2px 6px rgba(0,0,0,.03);
    }

    .product-inquiry-row.sent .product-inquiry-card {
      border-radius:16px 16px 4px 16px;
    }

    .product-inquiry-row.received .product-inquiry-card {
      border-radius:4px 16px 16px 16px;
    }

    .product-inquiry-label {
      font-size:11px;
      font-weight:700;
      color:#1F5A2D;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      gap:5px;
    }

    .product-inquiry-content {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .product-inquiry-img {
      width:54px;
      height:54px;
      border-radius:10px;
      object-fit:cover;
      flex-shrink:0;
    }

    .product-inquiry-name {
      font-size:12.5px;
      font-weight:800;
      color:#1f2937;
      line-height:1.25;
    }

    .product-inquiry-price {
      font-size:12px;
      font-weight:800;
      color:#1F5A2D;
      margin-top:3px;
    }

    .quick-replies {
      display:flex;
      gap:8px;
      overflow-x:auto;
      scrollbar-width:none;
      padding:12px 14px;
      background:#F5F5EE;
      flex-shrink:0;
    }

    .quick-replies::-webkit-scrollbar { display:none; }

    .qr-chip {
      padding:8px 14px;
      border-radius:20px;
      background:#ffffff;
      border:1px solid #e5e7eb;
      font-size:11.5px;
      font-weight:700;
      color:#4b5563;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 2px 4px rgba(0,0,0,.02);
    }

    .chat-input-bar {
      padding:12px 14px 24px;
      background:#F5F5EE;
      border-top:1px solid #E6ECE5;
      display:flex;
      gap:10px;
      align-items:center;
      flex-shrink:0;
    }

    .chat-input {
      flex:1;
      border:1px solid #F5F5EE;
      border-radius:24px;
      padding:12px 16px;
      font-size:13px;
      background:#ffffff;
      color:#1f2937;
      outline:none;
      font-weight:600;
      font-family:inherit;
    }

    .chat-input:focus {
      border-color:#1F5A2D;
      background:#ffffff;
    }

    .send-btn {
      width:44px;
      height:44px;
      border-radius:50%;
      background:#1F5A2D;
      border:none;
      color:white;
      font-size:14px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .nav-icon {
      font-size:18px;
      margin-bottom:4px;
    }

    .toast {
      position:fixed;
      bottom:90px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.85);
      color:#fff;
      padding:8px 18px;
      border-radius:20px;
      font-size:12px;
      z-index:999;
      opacity:0;
      transition:opacity .2s;
      pointer-events:none;
      white-space:nowrap;
      font-weight:500;
    }

    .toast.show { opacity:1; }
  </style>
</head>

<body>
<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <!-- BEFORE CLICK: Conversation list -->
  <div class="screen" id="convoList">
    <div class="green-zone">
      <div class="home-header">
        <div class="app-brand">
          <div class="brand-name">Messages</div>
        </div>

        <button class="icon-btn" onclick="showToast('New message feature coming soon!')">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>
      </div>

      <div class="search-bar">
        <span class="search-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" placeholder="Search conversations..." id="conversationSearch" oninput="filterConvos()">
      </div>
    </div>

    <div class="convo-list-wrap" id="convoListItems"></div>
  </div>

  <!-- AFTER CLICK: Specific chat -->
  <div class="chat-screen" id="chatScreen">
    <div class="chat-header">
      <button onclick="closeChat()" class="icon-btn" aria-label="Back">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <img id="chatAvatar" src="" alt="Customer">

      <div class="chat-header-info">
        <div class="chat-header-name" id="chatName">Customer</div>
        <div class="chat-header-status">
          <i class="fa-solid fa-circle" style="font-size:7px;"></i>
          Active Customer
        </div>
      </div>

      <button onclick="showToast('Customer contact details hidden for privacy.')" class="chat-info-btn" aria-label="Customer info">
        <i class="fa-solid fa-circle-info"></i>
      </button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="quick-replies" id="quickReplies">
      <div class="qr-chip" onclick="sendQuick('Yes, this item is still available!')">Yes, available</div>
      <div class="qr-chip" onclick="sendQuick('It is ready for farm pickup today until 12:00 PM.')">Ready for pickup</div>
      <div class="qr-chip" onclick="sendQuick('All our items are freshly harvested this morning! 🌿')">Freshly harvested</div>
      <div class="qr-chip" onclick="sendQuick('We can arrange delivery for you tomorrow.')">Delivery tomorrow</div>
    </div>

    <div class="chat-input-bar">
      <button class="icon-btn" style="background:transparent;color:var(--text-muted);" onclick="showToast('Photo upload coming soon!')">
        <i class="fa-solid fa-paperclip" style="font-size:16px;"></i>
      </button>
      <input type="text" class="chat-input" id="messageInput" placeholder="Reply to customer..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onclick="sendMessage()" aria-label="Send message">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <a href="farmer-dashboard.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-house"></i></span>Home
    </a>
    <a href="manage-products.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-store"></i></span>Shop
    </a>
    <a href="manage-orders.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-box"></i></span>Orders
    </a>
    <a href="farmer-chat.html" class="nav-item active">
      <span class="nav-icon"><i class="fa-solid fa-comment"></i></span>Chat
    </a>
    <a href="farmer-profile.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-user"></i></span>Profile
    </a>
  </nav>
</div>

<div class="toast" id="customToast"></div>

<script src="data.js"></script>
<script src="script.js"></script>

<script>
  let currentConvo = null;
  let replyIdx = 0;

  const AUTO_CUSTOMER_REPLIES = [
    "Alright, thank you! I will place an order now via the app. 👍",
    "Great! Can I choose farm pickup for this?",
    "Perfect. Is it organically grown?",
    "Okay, please let me know when it's ready.",
    "Thanks for the fast response! See you later."
  ];

  const FARMER_SIDE_CONVOS = [
    {
      id: 1,
      customerName: "Khairul Amri",
      customerImage: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100",
      lastMessage: "Is this organic tomato available today?",
      time: "5m ago",
      unread: 1,
      product: {
        name: "Organic Tomato",
        image: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400&h=400&fit=crop",
        price: "RM 4.50 / 1 kg"
      },
      messages: [
        { from: "consumer", text: "Hi, I am looking at your Organic Tomatoes.", time: "9:40 AM" },
        { from: "consumer", text: "Is this organic tomato available today?", time: "9:41 AM" }
      ]
    },
    {
      id: 2,
      customerName: "Sarah Tan",
      customerImage: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100",
      lastMessage: "Thank you for prepping my order! 🙏",
      time: "2h ago",
      unread: 0,
      product: {
        name: "Fresh Butterhead Lettuce",
        image: "https://images.unsplash.com/photo-1622206151226-18ca2c9ab4a1?w=400&h=400&fit=crop",
        price: "RM 3.00 / 250g"
      },
      messages: [
        { from: "consumer", text: "Hi, I just bought the Fresh Lettuce bundle.", time: "7:00 AM" },
        { from: "farmer", text: "Hi Sarah, yes! We are packing it fresh now.", time: "7:15 AM" },
        { from: "consumer", text: "Thank you for prepping my order! 🙏", time: "7:16 AM" }
      ]
    },
    {
      id: 3,
      customerName: "Muaz Jamil",
      customerImage: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100",
      lastMessage: "Can I collect around 11AM?",
      time: "1d ago",
      unread: 0,
      product: null,
      messages: [
        { from: "consumer", text: "Hello, what time is your farm open for collection?", time: "Yesterday" },
        { from: "farmer", text: "Hi! We are open from 7:00 AM until 12:00 PM.", time: "Yesterday" },
        { from: "consumer", text: "Can I collect around 11AM?", time: "Yesterday" }
      ]
    }
  ];

  function renderConvos() {
    const list = document.getElementById('convoListItems');
    if (!list) return;

    const q = (document.getElementById('conversationSearch')?.value || '').toLowerCase();
    const filtered = FARMER_SIDE_CONVOS.filter(convo =>
      convo.customerName.toLowerCase().includes(q) ||
      convo.lastMessage.toLowerCase().includes(q)
    );

    list.innerHTML = '';

    filtered.forEach(convo => {
      const div = document.createElement('div');
      div.className = 'convo-item';
      div.onclick = () => openChat(convo.id);

      div.innerHTML = `
        <div class="convo-avatar-wrap">
          <img src="${convo.customerImage}" class="convo-avatar" alt="">
          ${convo.unread > 0 ? '<div class="online-dot"></div>' : ''}
        </div>

        <div class="convo-info">
          <div class="convo-name">
            <span>${convo.customerName}</span>
          </div>
          <div class="convo-last">${convo.lastMessage}</div>
        </div>

        <div class="convo-right">
          <div class="convo-time">${convo.time}</div>
          ${convo.unread > 0 ? `<span class="unread-badge">${convo.unread}</span>` : ''}
        </div>
      `;

      list.appendChild(div);
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div style="padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13px;font-weight:600;">
          No conversations found
        </div>
      `;
    }
  }

  function filterConvos() {
    renderConvos();
  }

  function openChat(id) {
    currentConvo = FARMER_SIDE_CONVOS.find(c => c.id === id);
    if (!currentConvo) return;

    document.getElementById('chatAvatar').src = currentConvo.customerImage;
    document.getElementById('chatName').textContent = currentConvo.customerName;

    currentConvo.unread = 0;
    renderConvos();

    renderMessages();

    document.getElementById('convoList').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';

    const bottomNav = document.getElementById('bottomNav');
    if (bottomNav) bottomNav.style.display = 'none';

    setTimeout(scrollToBottom, 80);
  }

  function closeChat() {
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('convoList').style.display = 'block';

    const bottomNav = document.getElementById('bottomNav');
    if (bottomNav) bottomNav.style.display = 'flex';

    currentConvo = null;
  }

  function renderMessages() {
    const container = document.getElementById('chatMessages');
    if (!container || !currentConvo) return;

    container.innerHTML = '<div class="msg-day-label">Today</div>';

    if (currentConvo.product) {
      appendProductInquiry(currentConvo.product);
    }

    currentConvo.messages.forEach(msg => {
      const bubbleSide = msg.from === 'farmer' ? 'sent' : 'received';
      appendMessage(bubbleSide, msg.text, msg.time);
    });
  }

  function appendProductInquiry(product) {
    const container = document.getElementById('chatMessages');
    if (!container || !product) return;

    const row = document.createElement('div');
    row.className = 'product-inquiry-row received';

    row.innerHTML = `
      <div class="product-inquiry-card">
        <div class="product-inquiry-label">
          <i class="fa-solid fa-circle-info"></i>
          Customer inquiring about this product
        </div>

        <div class="product-inquiry-content">
          <img src="${product.image}" class="product-inquiry-img" alt="">

          <div>
            <div class="product-inquiry-name">${product.name}</div>
            <div class="product-inquiry-price">${product.price}</div>
          </div>
        </div>
      </div>
    `;

    container.appendChild(row);
  }

  function appendMessage(side, text, time) {
    const container = document.getElementById('chatMessages');
    if (!container) return;

    const row = document.createElement('div');
    row.className = 'msg-row ' + (side === 'sent' ? 'sent' : '');

    row.innerHTML = `
      <div class="msg-wrapper">
        <div class="message-bubble ${side === 'sent' ? 'sent' : 'received'}">${text}</div>
        <div class="message-time">${time}</div>
      </div>
    `;

    container.appendChild(row);
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();

    if (!text || !currentConvo) return;

    const now = new Date().toLocaleTimeString('en-MY', {
      hour: '2-digit',
      minute: '2-digit'
    });

    appendMessage('sent', text, now);

    currentConvo.messages.push({
      from: 'farmer',
      text: text,
      time: now
    });

    currentConvo.lastMessage = text;
    currentConvo.time = "Just now";

    input.value = '';
    scrollToBottom();
    renderConvos();

    setTimeout(() => {
      const reply = AUTO_CUSTOMER_REPLIES[replyIdx % AUTO_CUSTOMER_REPLIES.length];
      replyIdx++;

      appendMessage('received', reply, now);

      currentConvo.messages.push({
        from: 'consumer',
        text: reply,
        time: now
      });

      currentConvo.lastMessage = reply;
      currentConvo.time = "Just now";

      scrollToBottom();
      renderConvos();
    }, 1000);
  }

  function sendQuick(text) {
    document.getElementById('messageInput').value = text;
    sendMessage();
  }

  function scrollToBottom() {
    const m = document.getElementById('chatMessages');
    if (m) m.scrollTop = m.scrollHeight;
  }

  window.showToast = function(msg) {
    const t = document.getElementById('customToast');
    if (t) {
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof AppState !== 'undefined' && AppState.init) {
      AppState.init();
    }

    renderConvos();
  });
</script>
</body>
</html>
