<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeryHub - Sign In</title>
  <link rel="stylesheet" href="css/style1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ── Login: dark green theme ── */
    body { background: #e0ead8; }

    /* Phone screen — same gradient as splash */
    .screen {
      background: linear-gradient(
        160deg,
        #1f6f3d 0%,
        #2a8a4a 50%,
        #3aa35c 100%
      );
    }

    /* Status bar matches */
    .status-bar { background: #1f6f3d; color: rgba(255,255,255,.9); }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons i { font-size: 12px; color: rgba(255,255,255,.9); }

    /* ── Hero (brand area at top) — top padding matches splash's 60px ── */
    .login-hero {
      padding: 60px 28px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .screen::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      pointer-events: none;
      z-index: 0;
    }
    .screen::after {
      content: '';
      position: absolute;
      bottom: 60px; left: -70px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,.05);
      pointer-events: none;
      z-index: 0;
    }
    .login-hero, .login-body, .register-link { position: relative; z-index: 1; }

    /* Logo tile — same frosted glass as splash */
    .brand-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-bottom: 8px;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .app-logo { width: 70px; height: 70px; object-fit: contain; }

    /* Brand text — identical values to splash's .splash-title / .splash-tagline */
    .app-name {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 800;
      color: white;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .app-sub {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255,255,255,.85);
      margin-top: 10px;
      letter-spacing: .2px;
    }

    /* ── Form card — frosted glass, same spec as feature cards on splash ── */
    .login-body {
      margin: 0 40px 20px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 20px;
    }

    /* ── Inputs — dark green variant ── */
    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,.55);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 6px;
      display: block;
    }
    .input {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.15);
      color: white;
    }
    .input::placeholder { color: rgba(255,255,255,.35); }
    .input:focus {
      border-color: rgba(255,255,255,.40);
      background: rgba(255,255,255,.14);
    }

    /* ── Remember / Forgot row ── */
    .remember-forgot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,.6);
    }
    .remember-row input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #6fcf80;
    }
    .forgot-link {
      font-size: 13px;
      font-weight: 600;
      color: #6fcf80;
      text-decoration: none;
    }

    /* ── Primary button — white pill (dark-screen variant) ── */
    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      background: white;
      border: none;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 700;
      color: #1a4d2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
      transition: opacity .2s;
    }
    .btn-primary:active { opacity: .9; }

    /* ── Divider ── */
    .divider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,.15); }
    .divider-text {
      font-size: 11px;
      color: rgba(255,255,255,.4);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Social buttons ── */
    .social-row { display: flex; gap: 10px; }
    .btn-social {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.15);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .2s;
    }
    .btn-social:active { background: rgba(255,255,255,.16); }

    .btn-social .fa-google{ color: #ffffff;

    }
    .btn-social .fa-facebook-f{

    }

    /* ── Register prompt ── */
    .register-link {
      text-align: center;
      padding: 0 16px 28px;
      font-size: 13px;
      color: rgba(255,255,255,.55);
      margin-top: 20px;
    }
    .register-link a { color: white; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-three-quarters"></i>
    </div>
  </div>

  <div class="screen">

    <!-- Brand hero -->
    <div class="login-hero">
      <div class="brand-wrap">
        <div class="logo-container">
          <img class="app-logo" src="img/aeryhub-logo.png" alt="AeryHub Logo">
        </div>
        <div class="app-name">AeryHub</div>
      </div>
      <div class="app-sub">Fresh From Farm To Table</div>
    </div>

    <!-- Form card -->
    <div class="login-body">
      <div class="input-group">
        <label class="input-label">Email Address</label>
        <input type="email" id="email" class="input" placeholder="your@email.com" value="consumer@aeryhub.com">
      </div>

      <div class="input-group">
        <label class="input-label">Password</label>
        <input type="password" id="password" class="input" placeholder="Enter password" value="123456">
      </div>

      <div class="remember-forgot">
        <label class="remember-row">
          <input type="checkbox" id="remember" checked>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button class="btn-primary" id="signin-btn" onclick="handleLogin()">
        Sign In
      </button>

      <div class="divider-row">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with</span>
        <div class="divider-line"></div>
      </div>

      <div class="social-row">
        <button class="btn-social" onclick="showToast('Google login coming soon!')">
          <i class="fab fa-google"></i> Google
        </button>
        <button class="btn-social" onclick="showToast('Facebook login coming soon!')">
          <i class="fab fa-facebook-f"></i> Facebook
        </button>
      </div>
    </div>

    <div class="register-link">
      Don't have an account? <a href="register.html">Create Account</a>
    </div>

  </div><!-- /screen -->
</div><!-- /phone-frame -->

<script src="data.js"></script>
<script src="script.js"></script>
<script>
  function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    const btn   = document.getElementById('signin-btn');

    if (!email || !pass) {
      showToast('Please fill in all fields');
      return;
    }

    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';
    btn.disabled = true;

    setTimeout(() => {
      if (email === 'farmer@aeryhub.com' && pass === '123456') {
        AppState.login('farmer');
        window.location.href = 'farmer-dashboard.html';

      } else if (email === 'consumer@aeryhub.com' && pass === '123456') {
        AppState.login('consumer');
        window.location.href = 'home.html';

      } else if (email === 'b2b@aeryhub.com' && pass === '123456') {
        AppState.login('b2b');
        window.location.href = 'b2b-home.html';

      } else {
        showToast('Invalid credentials');
        btn.innerHTML = 'Sign In';
        btn.disabled = false;
      }
    }, 900);
  }
</script>
</body>
</html>
