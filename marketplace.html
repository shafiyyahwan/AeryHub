<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeryHub - Marketplace</title>

  <link rel="stylesheet" href="css/style1.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    body {
      background: #e0ead8;
    }

    .market-header {
      padding: 16px 20px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .market-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .results-count {
      font-size: 13px;
      color: var(--text-muted);
      padding: 10px 20px;
    }

    .market-grid {
      padding: 0 20px 20px;
    }

    .product-card-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .add-cart-mini {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--primary);
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .product-card-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .organic-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-500);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .wishlist-btn i {
      pointer-events: none;
    }

    .empty-icon {
      font-size: 34px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .stars-container {
      color: #ffc107;
      display: inline-flex;
      gap: 1px;
    }

    /* Mengunci container gambar supaya jika link rosak, layout tetap maintain tinggi 130px */
    .img-container {
      position: relative;
      width: 100%;
      height: 130px;
      background: #ebeeeb; /* Warna fallback background kelabu lembut */
      overflow: hidden;
    }
  </style>
</head>

<body>

<div class="phone-frame">

  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="screen">

    <div class="market-header">
      <div class="market-header-row">
        <div style="font-size:20px;font-weight:800;color:var(--text)">
          Marketplace
        </div>
        <a href="cart.html" class="icon-btn cart-nav-icon" style="text-decoration:none; width:40px; height:40px; border-radius:12px; background:var(--gray-100); border:none; display:flex; align-items:center; justify-content:center; font-size:18px; position:relative; color:var(--text);">
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
      </div>

      <div class="search-bar" style="margin-bottom:12px">
        <span class="search-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" placeholder="Search products..." id="searchInput" oninput="filterProducts()">
        <span style="font-size:16px;color:var(--text-muted)">
          <i class="fa-solid fa-sliders"></i>
        </span>
      </div>

      <div class="filter-bar" id="catFilter">
        <div class="filter-chip active" onclick="filterCat('')" data-cat="">All</div>
        <div class="filter-chip" onclick="filterCat('Vegetables')" data-cat="Vegetables">Vegetables</div>
        <div class="filter-chip" onclick="filterCat('Fruits')" data-cat="Fruits">Fruits</div>
        <div class="filter-chip" onclick="filterCat('Herbs')" data-cat="Herbs">Herbs</div>
        <div class="filter-chip" onclick="filterCat('Aquaculture products')" data-cat="Aquaculture products">Aquaculture</div>
        <div class="filter-chip" onclick="filterCat('organic')" data-cat="organic">Organic</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px 0;">
      <div class="results-count" style="padding:0" id="resultsCount">0 products found</div>
      <select style="border:1.5px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; color:var(--text); background:var(--surface); font-family:var(--font);" onchange="sortProducts(this.value)">
        <option value="default">Sort: Featured</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Highest Rated</option>
      </select>
    </div>

    <div class="market-grid">
      <div class="grid-2" id="productGrid" style="margin-top:12px"></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-house"></i></span>Home
    </a>
    <a href="marketplace.html" class="nav-item active">
      <span class="nav-icon"><i class="fa-solid fa-store"></i></span>Shop
    </a>
    <a href="orders.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-box"></i></span>Orders
    </a>
    <a href="chat.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-comment"></i></span>Chat
    </a>
    <a href="consumer-profile.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-user"></i></span>Profile
    </a>
  </nav>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

<script>
  let currentCat = '';
  let currentSearch = '';
  let currentSort = 'default';

  function getLowestPrice(product) {
    if (!product.pricing || product.pricing.length === 0) return 0;
    return Math.min(...product.pricing.map(p => p.price));
  }

  function getPriceLabel(product) {
    if (!product.pricing || product.pricing.length === 0) return '';
    return product.pricing[0].label;
  }

  function generateStars(rating) {
    let starsHtml = '';

    // Bundarkan rating kepada 0.5 terdekat (Contoh: 4.9 jadi 5.0, 4.4 jadi 4.5, 4.2 jadi 4.0)
    const roundedRating = Math.round(rating * 2) / 2;

    const fullStars = Math.floor(roundedRating);
    const hasHalf = (roundedRating % 1 !== 0); // Jika ada baki .5, maksudnya ada bintang separuh

    // 1. Tambah bintang penuh
    for (let i = 0; i < fullStars; i++) {
      starsHtml += '<i class="fa-solid fa-star"></i>';
    }

    // 2. Tambah bintang separuh jika ada
    if (hasHalf) {
      starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
    }

    // 3. Cukupkan baki dengan bintang kosong supaya total ada 5 ikon bintang
    const currentTotal = fullStars + (hasHalf ? 1 : 0);
    for (let i = currentTotal; i < 5; i++) {
      starsHtml += '<i class="fa-regular fa-star"></i>';
    }

    return `<div class="stars-container">${starsHtml}</div>`;
  }

  function renderProducts() {
    let filtered = [...PRODUCTS];

    if (currentCat === 'organic') {
      filtered = filtered.filter(p => p.organic);
    } else if (currentCat) {
      filtered = filtered.filter(p => p.category === currentCat);
    }

    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filtered = filtered.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q)
      );
    }

    if (currentSort === 'price-low') {
      filtered.sort((a,b) => getLowestPrice(a) - getLowestPrice(b));
    } else if (currentSort === 'price-high') {
      filtered.sort((a,b) => getLowestPrice(b) - getLowestPrice(a));
    } else if (currentSort === 'rating') {
      filtered.sort((a,b) => b.rating - a.rating);
    }

    document.getElementById('resultsCount').textContent = `${filtered.length} products found`;
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';

    filtered.forEach(p => {
      const f = (typeof FARMERS !== 'undefined') ? FARMERS.find(farmer => farmer.id === p.farmerId) : null;
      const displayPrice = getLowestPrice(p);
      const displayUnit = getPriceLabel(p);
      const farmState = f && f.state ? f.state : "Selangor";

      // Memastikan format rating dipaparkan satu angka perpuluhan (cth: 4.5, 5.0)
      const formattedRating = (p.rating || 0).toFixed(1);

      const card = document.createElement('div');
      card.className = 'product-card fade-in';
      card.innerHTML = `
        <div class="img-container">
          <img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:130px; object-fit:cover;" onerror="this.style.display='none';">
          <button class="wishlist-btn" style="position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.95); border:none; border-radius:8px; width:30px; height:30px; font-size:14px; cursor:pointer; color:#d11a2a; z-index:2;" onclick="event.stopPropagation();toggleWish(${p.id},this)">
            ${(typeof AppState !== 'undefined' && AppState.wishlist && AppState.wishlist.includes(p.id))
        ? '<i class="fa-solid fa-heart"></i>'
        : '<i class="fa-regular fa-heart"></i>'
      }
          </button>
          ${p.organic ? `<span class="badge badge-green" style="position:absolute; top:8px; left:8px; font-size:9px; background:#2e7d32; color:white; padding:2px 6px; border-radius:4px; z-index:2;">Organik</span>` : ''}
        </div>

        <div class="product-card-body" style="padding:10px; background:#fff; display:flex; flex-direction:column; min-height:125px; height:auto;">

          <div style="display:flex; flex-direction:column; gap:2px;">
            <div class="product-card-name" style="font-weight:600; font-size:13px; color:#212121; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
              ${p.name}
            </div>

            <div class="product-card-farmer" style="font-size:11px; color:#757575; display:flex; align-items:center; gap:4px;">
              <i class="fa-solid fa-location-dot" style="font-size:10px; color:#9e9e9e;"></i> ${farmState}
            </div>

            <div class="product-card-rating" style="display:flex; align-items:center; gap:4px; font-size:11px;">
              ${generateStars(p.rating)}
              <span style="color:#212121; font-weight:600; margin-left:2px;">${formattedRating}</span>
              <span style="color:#757575; font-size:10px;">(${p.reviews})</span>
            </div>
          </div>

          <div style="flex-grow: 1;"></div>

          <div class="product-card-price-row" style="display:flex; align-items:center; justify-content:between; padding-top:4px;">
            <div class="product-price" style="font-weight:700; color:#2e7d32; font-size:14px;">
              RM ${displayPrice.toFixed(2)}
            </div>
            <button class="add-cart-mini" onclick="event.stopPropagation(); handleQuickAdd(${p.id}, '${displayUnit}', ${displayPrice})">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      `;

      card.onclick = () => {
        localStorage.setItem('currentProduct', p.id);
        window.location.href = 'product-details.html';
      };

      grid.appendChild(card);
    });

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1; text-align:center; padding:40px 0;">
          <div class="empty-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
          <div class="empty-title" style="font-weight:700; margin-top:8px;">No products found</div>
          <div class="empty-text" style="color:#757575; font-size:12px;">Try a different search or category</div>
        </div>
      `;
    }
  }

  function handleQuickAdd(productId, variantLabel, unitPrice) {
    if (typeof AppState !== 'undefined' && AppState.addToCart) {
      AppState.addToCart(productId, variantLabel, 1, unitPrice);
      if (typeof showToast === 'function') showToast('Item added to cart');
      updateCartBadge();
    }
  }

  function updateCartBadge() {
    if (typeof AppState === 'undefined' || !AppState.cart) return;
    const count = AppState.cart.reduce((s, i) => s + i.qty, 0);
    document.querySelectorAll('.cart-nav-icon').forEach(el => {
      let badge = el.querySelector('.cart-count');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'cart-count';
        badge.style = "position:absolute; top:-4px; right:-4px; background:#ee4d2d; color:white; border-radius:50%; padding:2px 6px; font-size:10px; font-weight:700;";
        el.appendChild(badge);
      }
      badge.textContent = count;
      badge.style.display = count > 0 ? 'block' : 'none';
    });
  }

  function filterCat(cat) {
    currentCat = cat;
    document.querySelectorAll('.filter-chip').forEach(c => {
      c.classList.toggle('active', c.getAttribute('data-cat') === cat);
    });
    renderProducts();
  }

  function filterProducts() {
    currentSearch = document.getElementById('searchInput').value;
    renderProducts();
  }

  function sortProducts(val) {
    currentSort = val;
    renderProducts();
  }

  function toggleWish(id, btn) {
    if (typeof AppState === 'undefined' || !AppState.toggleWishlist) return;
    AppState.toggleWishlist(id);
    const isWished = AppState.wishlist.includes(id);
    btn.innerHTML = isWished ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
    if (typeof showToast === 'function') showToast(isWished ? 'Added to wishlist' : 'Removed from wishlist');
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof AppState !== 'undefined' && AppState.init) {
      AppState.init();
    } else if (typeof AppState !== 'undefined' && AppState.loadCart) {
      AppState.loadCart();
    }

    const cat = localStorage.getItem('filterCat') || '';
    if (cat) {
      currentCat = cat;
      localStorage.removeItem('filterCat');
      document.querySelectorAll('.filter-chip').forEach(c => {
        c.classList.toggle('active', c.getAttribute('data-cat') === cat);
      });
    }

    renderProducts();
    updateCartBadge();
  });
</script>

</body>
</html>
