<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeryHub - B2B Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    body { background:#e0ead8; }

    .status-bar {
      background:#1F5A2D !important;
      color:#fff !important;
    }

    .screen {
      flex:1;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      background:#F5F5EE;
      position:relative;
      scrollbar-width:none;
      padding-bottom:80px;
    }
    .screen::-webkit-scrollbar { display:none; }

    /* BEFORE CLICK: Messages list header, same style as Home */
    .green-zone {
      background:#1F5A2D;
      padding:0 20px 20px;
      position:sticky;
      top:0;
      z-index:100;
    }

    .home-header {
      background:transparent !important;
      padding:14px 0 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .app-brand {
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .brand-name {
      font-size:20px;
      font-weight:700;
      color:#ffffff;
      line-height:1;
      letter-spacing:.2px;
    }

    .page-subtitle {
      font-size:14px;
      font-weight:500;
      color:#E6F2DF;
      margin-top:5px;
    }

    .icon-btn {
      width:40px;
      height:40px;
      border-radius:12px;
      background:rgba(255,255,255,.14);
      color:#fff;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      cursor:pointer;
      text-decoration:none;
      position:relative;
      flex-shrink:0;
    }
    .icon-btn:active { background:rgba(255,255,255,.24); }

    .search-bar {
      background:#fff;
      border:none;
      border-radius:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
      margin-top:15px;
    }

    /* Conversation list */
    .convo-list-wrap {
      margin-top:0;
      background:#F5F5EE;
    }

    #convoListItems {
      background:#FFFFFF;
      border-top-left-radius:18px;
      border-top-right-radius:18px;
      overflow:hidden;
    }

    .convo-item {
      display:flex;
      gap:14px;
      align-items:center;
      padding:14px 20px;
      cursor:pointer;
      border-bottom:1px solid #f3f4f6;
      background:#FFFFFF;
      transition:background .15s;
    }
    .convo-item:hover,
    .convo-item:active { background:var(--gray-50); }

    .convo-avatar-wrap {
      position:relative;
      width:48px;
      height:48px;
      flex-shrink:0;
    }
    .convo-avatar {
      width:48px !important;
      height:48px !important;
      min-width:48px !important;
      max-width:48px !important;
      border-radius:14px;
      object-fit:cover;
      border:1px solid #eee;
      display:block;
      background:#ebeeeb;
    }
    .online-dot {
      position:absolute;
      bottom:-1px;
      right:-1px;
      width:11px;
      height:11px;
      border-radius:50%;
      background:#22c55e;
      border:2px solid var(--surface);
    }

    .convo-info { flex:1; min-width:0; }
    .convo-name {
      font-size:13.5px;
      font-weight:700;
      color:var(--text);
      margin-bottom:3px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .convo-last {
      font-size:12.5px;
      color:var(--text-muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:500;
    }
    .convo-right { text-align:right; flex-shrink:0; }
    .convo-time { font-size:11px; color:var(--text-muted); margin-bottom:5px; font-weight:500; }
    .unread-badge { background:#1F5A2D; color:white; border-radius:10px; padding:2px 7px; font-size:10px; font-weight:800; }

    /* AFTER CLICK: normal chat screen */
    .chat-screen {
      display:none;
      flex-direction:column;
      position:absolute;
      top:44px;
      bottom:0;
      left:0;
      right:0;
      background:#F5F5EE;
      z-index:200;
    }

    .chat-header {
      min-height:82px;
      padding:18px 18px;
      background:#1F5A2D;
      border-bottom:1px solid rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
    }

    .chat-header .icon-btn {
      background:transparent;
      color:#ffffff;
      width:30px;
      height:30px;
      border:none;
      outline:none;
      box-shadow:none;
      border-radius:0;
      font-size:15px;
      padding:0;
    }
    .chat-header .icon-btn:focus,
    .chat-header .icon-btn:focus-visible,
    .chat-header .icon-btn:active {
      background:transparent;
      outline:none;
      box-shadow:none;
    }

    #chatAvatar {
      width:50px !important;
      height:50px !important;
      border-radius:10px !important;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.85);
      flex-shrink:0;
    }

    .chat-shop-btn {
      width:34px;
      height:34px;
      border-radius:0;
      background:transparent;
      color:#ffffff;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      cursor:pointer;
      flex-shrink:0;
      outline:none;
      box-shadow:none;
      padding:0;
    }
    .chat-shop-btn i { font-size:22px; }
    .chat-shop-btn:focus,
    .chat-shop-btn:focus-visible,
    .chat-shop-btn:active {
      background:transparent;
      outline:none;
      box-shadow:none;
    }

    .chat-header-info { flex:1; min-width:0; }
    .chat-header-name {
      font-size:14.5px;
      font-weight:800;
      color:#ffffff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .chat-header-status {
      font-size:11.5px;
      color:#E6F2DF;
      font-weight:600;
      margin-top:6px;   /* was 2px */
      display:flex;
      align-items:center;
      gap:5px;
    }

    #productContext {
      display:none;
      padding:10px 16px;
      background:#ffffff !important;
      border-bottom:1px solid #eef0ed;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
      z-index:45;
    }

    .product-preview-bubble {
      background:#f8faf8;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:8px;
      max-width:260px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .ppb-img {
      width:55px !important;
      height:55px !important;
      object-fit:cover;
      border-radius:8px;
      flex-shrink:0;
    }
    .ppb-info { display:flex; flex-direction:column; gap:2px; }
    .ppb-name { font-size:12px; font-weight:700; color:#1f2937; line-height:1.2; }
    .ppb-price { font-size:12px; font-weight:800; color:#1F5A2D; margin-top:0; }


    .product-inquiry-row {
      display:flex;
      justify-content:flex-end;
      width:100%;
    }

    .product-inquiry-card {
      max-width:270px;
      background:#ffffff;
      border:1px solid #E1E7DD;
      border-radius:16px 16px 4px 16px;
      padding:10px;
      box-shadow:0 2px 6px rgba(0,0,0,.03);
    }

    .product-inquiry-label {
      font-size:11px;
      font-weight:700;
      color:#1F5A2D;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      gap:5px;
    }

    .product-inquiry-content {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .product-inquiry-img {
      width:54px;
      height:54px;
      border-radius:10px;
      object-fit:cover;
      flex-shrink:0;
    }

    .product-inquiry-name {
      font-size:12.5px;
      font-weight:800;
      color:#1f2937;
      line-height:1.25;
    }

    .product-inquiry-price {
      font-size:12px;
      font-weight:800;
      color:#1F5A2D;
      margin-top:3px;
    }

    .chat-messages {
      flex:1;
      overflow-y:auto;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
      background:#F5F5EE;
      scrollbar-width:none;
    }
    .chat-messages::-webkit-scrollbar { display:none; }

    .msg-row { display:flex; width:100%; }
    .msg-row.sent { justify-content:flex-end; }
    .msg-wrapper { max-width:78%; display:flex; flex-direction:column; }
    .msg-row.sent .msg-wrapper { align-items:flex-end; }

    .message-bubble{
      display:inline-block;
      width:fit-content;
      max-width:100%;
      padding:11px 15px;
      box-sizing:border-box;
      padding:11px 15px;
      font-size:13px;
      line-height:1.5;
      font-weight:600;
      box-shadow:0 2px 4px rgba(0,0,0,.02);
    }
    .message-bubble.received {
      background:#ffffff;
      color:#1f2937;
      border-radius:4px 16px 16px 16px;
      border:1px solid #eef0ed;
    }
    .message-bubble.sent {
      background:#1F5A2D;
      color:#ffffff;
      border-radius:16px 16px 4px 16px;
    }
    .message-time { font-size:10px; color:#9ca3af; margin-top:4px; font-weight:600; }
    .msg-day-label { text-align:center; font-size:11px; color:#9ca3af; font-weight:700; margin:8px 0; letter-spacing:.5px; }

    .quick-replies {
      display:flex;
      gap:8px;
      overflow-x:auto;
      scrollbar-width:none;
      padding:12px 14px;
      background:#F5F5EE;
      flex-shrink:0;
    }
    .quick-replies::-webkit-scrollbar { display:none; }
    .qr-chip {
      padding:8px 14px;
      border-radius:20px;
      background:#ffffff;
      border:1px solid #e5e7eb;
      font-size:11.5px;
      font-weight:700;
      color:#4b5563;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 2px 4px rgba(0,0,0,.02);
    }

    .chat-input-bar {
      padding:12px 14px 24px;
      background:#F5F5EE;
      border-top:1px solid #E6ECE5;
      display:flex;
      gap:10px;
      align-items:center;
      flex-shrink:0;
    }
    .chat-input {
      flex:1;
      border:1px solid #F5F5EE;
      border-radius:24px;
      padding:12px 16px;
      font-size:13px;
      background:#ffffff;
      color:#1f2937;
      outline:none;
      font-weight:600;
      font-family:inherit;
    }
    .chat-input:focus { border-color:#1F5A2D; background:#ffffff; }
    .send-btn {
      width:44px;
      height:44px;
      border-radius:50%;
      background:#1F5A2D;
      border:none;
      color:white;
      font-size:14px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .nav-icon { font-size:18px; margin-bottom:4px; }

    .toast {
      position:fixed;
      bottom:90px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.85);
      color:#fff;
      padding:8px 18px;
      border-radius:20px;
      font-size:12px;
      z-index:999;
      opacity:0;
      transition:opacity .2s;
      pointer-events:none;
      white-space:nowrap;
      font-weight:500;
    }
    .toast.show { opacity:1; }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <!-- BEFORE CLICK: Conversation list -->
  <div class="screen" id="convoList">
    <div class="green-zone">
      <div class="home-header">
        <div class="app-brand">
          <div class="brand-name">Messages</div>
        </div>

        <button class="icon-btn" onclick="showToast('New message feature coming soon!')">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>
      </div>

      <div class="search-bar">
        <span class="search-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" placeholder="Search conversations...">
      </div>
    </div>

    <div class="convo-list-wrap" id="convoListItems"></div>
  </div>

  <!-- AFTER CLICK: Specific chat -->
  <div class="chat-screen" id="chatScreen">
    <div class="chat-header">
      <button onclick="closeChat()" class="icon-btn">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <img id="chatAvatar" src="" alt="">

      <div class="chat-header-info">
        <div class="chat-header-name" id="chatName">Farm</div>
        <div class="chat-header-status">
          <i class="fa-solid fa-circle" style="font-size:7px;"></i>
          Online &middot; replies instantly
        </div>
      </div>

      <button onclick="openFarmerProfile()" class="chat-shop-btn" aria-label="View farmer profile">
        <i class="fa-solid fa-store"></i>
      </button>
    </div>

    <div id="productContext">
      <div style="font-size:10.5px; color:#6b7280; margin-bottom:6px; font-weight:700;">
        <i class="fa-solid fa-circle-info" style="margin-right:3px;"></i> Inquiring about product:
      </div>
      <div class="product-preview-bubble">
        <img id="ppbImg" src="" class="ppb-img" alt="">
        <div class="ppb-info">
          <div class="ppb-name" id="ppbName"></div>
          <div class="ppb-price" id="ppbPrice"></div>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="quick-replies" id="quickReplies">
      <div class="qr-chip" onclick="sendQuick('Can I confirm this week's supply?')">Confirm weekly supply?</div>
      <div class="qr-chip" onclick="sendQuick('Can you prepare 20kg tomorrow?')">20kg tomorrow?</div>
      <div class="qr-chip" onclick="sendQuick('Can we arrange delivery?')">Arrange delivery?</div>
    </div>

    <div class="chat-input-bar">
      <button class="icon-btn" style="background:transparent;color:var(--text-muted);" onclick="showToast('Attach file coming soon!')">
        <i class="fa-solid fa-paperclip" style="font-size:16px;"></i>
      </button>
      <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <a href="b2b-home.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-house"></i></span>Home
    </a>
    <a href="bulk-orders.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-boxes-stacked"></i></span>Bulk
    </a>
    <a href="b2b-orders.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-box"></i></span>Orders
    </a>
    <a href="b2b-chat.html" class="nav-item active">
      <span class="nav-icon"><i class="fa-solid fa-comment"></i></span>Chat
    </a>
    <a href="b2b-profile.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-user"></i></span>Profile
    </a>
  </nav>
</div>

<div class="toast" id="customToast"></div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
  let currentConvo = null;

  const AUTO_REPLIES = [
    "Hello! Thank you for reaching out. We can prepare the weekly supply for your restaurant.",
    "Yes, the requested quantity is available. We will confirm the harvest schedule shortly.",
    "Delivery can be arranged through our logistics partner.",
    "Thank you. I will update you once the bulk order is ready for confirmation."
  ];
  let replyIdx = 0;

  let EXTENDED_CONVOS = [
    {
      id: 1,
      farmerId: 1,
      farmerName: "Ladang Hijau Selangor",
      lastMessage: "Your weekly supply request can be prepared for Friday delivery.",
      time: "10m ago",
      unread: 1,
      messages: [
        { from: "consumer", text: "Hi, can we confirm this week's vegetables supply for Restoran Seri Selera?", time: "9:35 AM" },
        { from: "farmer", text: "Hello! Yes, we can prepare the weekly supply. Please confirm the quantity needed.", time: "9:39 AM" },
        { from: "consumer", text: "We need 20kg tomato, 10kg lettuce and 15kg spinach.", time: "9:41 AM" },
        { from: "farmer", text: "Your weekly supply request can be prepared for Friday delivery.", time: "9:45 AM" }
      ]
    },
    {
      id: 2,
      farmerId: 1,
      farmerName: "Ladang Hijau Selangor",
      lastMessage: "The bulk order BO-1001 is currently under farmer review.",
      time: "Yesterday",
      unread: 0,
      messages: [
        { from: "consumer", text: "Hi, I have submitted bulk order BO-1001.", time: "Yesterday" },
        { from: "farmer", text: "The bulk order BO-1001 is currently under farmer review.", time: "Yesterday" }
      ]
    }
  ];

  function renderConvos() {
    const list = document.getElementById('convoListItems');
    if(!list) return;
    list.innerHTML = '';

    EXTENDED_CONVOS.forEach(convo => {
      const farmer = FARMERS.find(f => f.id === convo.farmerId);
      const farmNameDisplay = farmer?.shopName || farmer?.farm || 'Independent Farm';

      const div = document.createElement('div');
      div.className = 'convo-item';
      div.onclick = () => openChat(convo.id);

      div.innerHTML = `
      <div class="convo-avatar-wrap">
        <img src="${farmer?.image || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="convo-avatar" alt="">
        ${convo.id === 1 ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="convo-info">
        <div class="convo-name">
          <span>${farmNameDisplay}</span>
        </div>
        <div class="convo-last">${convo.lastMessage}</div>
      </div>
      <div class="convo-right">
        <div class="convo-time">${convo.time}</div>
        ${convo.unread > 0 ? `<span class="unread-badge">${convo.unread}</span>` : ''}
      </div>
    `;
      list.appendChild(div);
    });
  }

  function openChat(id) {
    currentConvo = EXTENDED_CONVOS.find(c => c.id === id);
    if(!currentConvo) return;

    const farmer = FARMERS.find(f => f.id === currentConvo.farmerId);
    const farmNameDisplay = farmer?.shopName || farmer?.farm || 'Independent Farm';

    document.getElementById('chatAvatar').src = farmer?.image || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';
    document.getElementById('chatName').textContent = farmNameDisplay;

    const currentProdId = localStorage.getItem('currentProduct');
    currentConvo.activeProduct = null;

    if (currentProdId) {
      const prod = PRODUCTS.find(p => p.id === parseInt(currentProdId, 10));
      if (prod && prod.farmerId === currentConvo.farmerId) {
        currentConvo.activeProduct = prod;
      }
    }

    renderMessages();
    document.getElementById('convoList').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    const bottomNav = document.getElementById('bottomNav');
    if (bottomNav) bottomNav.style.display = 'none';
    setTimeout(scrollToBottom, 50);
  }

  function closeChat() {
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('convoList').style.display = 'block';
    document.getElementById('productContext').style.display = 'none';
    const bottomNav = document.getElementById('bottomNav');
    if (bottomNav) bottomNav.style.display = 'flex';
    currentConvo = null;
  }

  function renderMessages() {
    const container = document.getElementById('chatMessages');
    if(!container) return;
    container.innerHTML = '<div class="msg-day-label">Today</div>';

    if (currentConvo.activeProduct) {
      appendProductInquiry(currentConvo.activeProduct);
    }

    currentConvo.messages.forEach(msg => {
      appendMessage(msg.from, msg.text, msg.time);
    });
  }


  function appendProductInquiry(prod) {
    const container = document.getElementById('chatMessages');
    if(!container || !prod) return;

    let displayPrice = prod.price ? prod.price.toFixed(2) : "0.00";
    let displayUnit = prod.unit || 'unit';
    if(prod.pricing && prod.pricing.length > 0) {
      displayPrice = Number(prod.pricing[0].price).toFixed(2);
      displayUnit = prod.pricing[0].label;
    }

    const imgSrc = (prod.images && prod.images.length > 0) ? prod.images[0] : '';
    const row = document.createElement('div');
    row.className = 'product-inquiry-row';
    row.innerHTML = `
      <div class="product-inquiry-card">
        <div class="product-inquiry-label">
          <i class="fa-solid fa-circle-info"></i>
          Inquiring about this product
        </div>
        <div class="product-inquiry-content">
          <img src="${imgSrc}" class="product-inquiry-img" alt="">
          <div>
            <div class="product-inquiry-name">${prod.name}</div>
            <div class="product-inquiry-price">RM ${displayPrice} / ${displayUnit}</div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(row);
  }

  function openFarmerProfile() {
    if (!currentConvo) return;
    localStorage.setItem('currentFarmer', currentConvo.farmerId);
    window.location.href = 'farmer-profile.html';
  }

  function appendMessage(from, text, time) {
    const container = document.getElementById('chatMessages');
    if(!container) return;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (from === 'consumer' ? 'sent' : '');
    row.innerHTML = `
    <div class="msg-wrapper">
      <div class="message-bubble ${from === 'consumer' ? 'sent' : 'received'}">${text}</div>
      <div class="message-time">${time}</div>
    </div>
  `;
    container.appendChild(row);
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    const now = new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
    appendMessage('consumer', text, now);
    input.value = '';
    scrollToBottom();

    setTimeout(() => {
      const reply = AUTO_REPLIES[replyIdx % AUTO_REPLIES.length];
      replyIdx++;
      appendMessage('farmer', reply, now);
      scrollToBottom();
    }, 1000);
  }

  function sendQuick(text) {
    document.getElementById('messageInput').value = text;
    sendMessage();
  }

  function scrollToBottom() {
    const m = document.getElementById('chatMessages');
    if(m) m.scrollTop = m.scrollHeight;
  }

  window.showToast = function(msg) {
    const t = document.getElementById('customToast');
    if(t) {
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    renderConvos();

    const directFarmerIdStr = localStorage.getItem('directChatFarmerId');

    if (directFarmerIdStr) {
      const targetFarmerId = parseInt(directFarmerIdStr, 10);
      let matchedConvo = EXTENDED_CONVOS.find(c => c.farmerId === targetFarmerId);

      if (!matchedConvo) {
        const farmerData = FARMERS.find(f => f.id === targetFarmerId);
        const newId = EXTENDED_CONVOS.length + 1;
        matchedConvo = {
          id: newId,
          farmerId: targetFarmerId,
          farmerName: farmerData ? (farmerData.shopName || farmerData.farm) : "Farmer Store",
          lastMessage: "Tap to view query details",
          time: "Now",
          unread: 0,
          messages: []
        };
        EXTENDED_CONVOS.push(matchedConvo);
        renderConvos();
      }

      localStorage.removeItem('directChatFarmerId');
      openChat(matchedConvo.id);
    }
  });
</script>
</body>
</html>
